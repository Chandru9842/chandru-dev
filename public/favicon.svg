<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#10b981" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Subtle Circuit Lines -->
  <path d="M12 20 L24 20 L28 24" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" fill="none" stroke-linecap="round"/>
  <circle cx="12" cy="20" r="2" fill="#10b981" fill-opacity="0.5"/>
  <path d="M52 44 L40 44 L36 40" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" fill="none" stroke-linecap="round"/>
  <circle cx="52" cy="44" r="2" fill="#10b981" fill-opacity="0.5"/>
  
  <!-- Sleek Tech Monogram "C" & Code Bracket Core -->
  <path d="M42 22 C37 17 25 17 20 24 C15 31 15 39 20 44 C26 50 38 49 42 43" 
        stroke="url(#glowGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        fill="none" 
        filter="url(#glow)"/>
        
  <!-- Neon Accent Spark Node -->
  <circle cx="42" cy="22" r="3" fill="#34d399" filter="url(#glow)"/>
  <circle cx="42" cy="43" r="3" fill="#34d399" filter="url(#glow)"/>
</svg>
