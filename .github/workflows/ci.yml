name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-verify:
    name: 🏗️ Quality Audit & Production Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-size: '20'
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: ⚙️ Run Linters & Type Checks
        run: npm run lint

      - name: 🔨 Compile Production Bundle (Full-Stack Express + React)
        run: npm run build
        env:
          NODE_ENV: production

      - name: 🕵️ Verify Production Build Artifacts Integrity
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: Dist directory was not created!"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "Error: Production frontend bundle index.html is missing!"
            exit 1
          fi
          if [ ! -f "dist/server.cjs" ]; then
            echo "Error: Production bundled backend server.cjs is missing!"
            exit 1
          fi
          echo "Success: Production bundle built and validated perfectly."
